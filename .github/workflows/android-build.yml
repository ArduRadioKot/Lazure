name: Android build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      with_models:
        description: "Download speech models and the bundled LLM, then build an arm64 release APK (~1 GB)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        run: |
          # Do NOT use android-actions/setup-android@v3: its default 'tools' package
          # no longer exists in the SDK repository and makes sdkmanager exit 1.
          # Install the exact versions declared in src/mobile/android/build.gradle.kts.
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1" > /dev/null
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Evaluation script self-tests
        run: python3 -m unittest discover -s tools/eval -v

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Debug APK (no models; for UI and build checks)
        if: ${{ !inputs.with_models }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Download models and bundled LLM
        if: ${{ inputs.with_models }}
        run: bash tools/models/fetch_models.sh

      - name: Release APK with models (arm64-v8a)
        if: ${{ inputs.with_models }}
        run: ./gradlew :app:assembleRelease -Plazure.abis=arm64-v8a --stacktrace

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: src/mobile/android/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.with_models && 'lazure-release-arm64' || 'lazure-debug-no-models' }}
          path: src/mobile/android/build/outputs/apk/*/*.apk
          if-no-files-found: error
